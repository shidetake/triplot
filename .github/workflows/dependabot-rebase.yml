# main に何か入ったら、自動マージを待っている Dependabot の PR のうち土台が古くなった
# ものに、作り直しを頼む。
#
# main のブランチ保護は「main の最新を取り込んでいること」をマージの条件にしている
# （古い土台の上で緑だった PR が、新しい組み合わせでは壊れているのをすり抜けさせない）。
# ところが Dependabot は、衝突しない限り古くなっただけの PR を自分からは作り直さない
# ので、1本入るたびに残りが緑のまま止まる。作り直しは Dependabot 自身にさせる
# （`@dependabot rebase`）—— こちらで branch を更新すると、その push では CI が走らず、
# Dependabot もその PR を手放す。
name: Dependabot rebase

on:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MAIN: ${{ github.sha }}
        run: |
          # 古いかどうかは PR の先頭と main を直接比べる。一覧の mergeStateStatus は
          # GitHub が計算を後回しにしていて、push の直後はほぼ UNKNOWN で返る。
          gh pr list -R "$REPO" --author "app/dependabot" --state open \
            --json number,headRefOid,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null) | "\(.number) \(.headRefOid)"' |
          while read -r n head; do
            behind=$(gh api "repos/$REPO/compare/$MAIN...$head" --jq .behind_by)
            if [ "$behind" -gt 0 ]; then
              gh pr comment "$n" -R "$REPO" --body "@dependabot rebase"
            fi
          done
