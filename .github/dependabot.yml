# 依存の更新の PR を Dependabot に出させる。運用（どれを自動で入れ、どれを人が見るか）は
# docs/development.md の「依存の更新」。グループ名はラベルの付け分けと自動マージ
# （.github/workflows/dependabot.yml）がそのまま使うので、変えるなら両方を直す。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # 公開直後の版は取らない（乗っ取られたアカウントから出た悪意のある版は、たいてい
    # 数日で見つかって取り下げられる）。セキュリティの修正には効かない。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      # どれにも入らないもの（＝メジャー）は1件ずつの PR になる。グループ同士は重ならない
      # ように書く（重ねていた時、ワイルドカードで書いた iOS の依存が web-production に
      # 入った。書いた順には当てはめてくれない）。
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      # iOS でだけ使う依存のうち、Expo の SDK が版を決めていないもの。マージしても次の
      # ビルドと TestFlight での確認を経てから利用者に届くので、自動で入れる。
      ios:
        dependency-type: production
        patterns:
          - expo-share-intent
          - "@react-native-google-signin/*"
          - "@tanstack/react-query"
          - use-intl
        update-types: [minor, patch]
      web-production:
        dependency-type: production
        # ios と同じ並び（片方だけ直すと重なる）
        exclude-patterns:
          - expo-share-intent
          - "@react-native-google-signin/*"
          - "@tanstack/react-query"
          - use-intl
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Expo の SDK が版を決めている依存には触らない。Expo は SDK ごとに動作を確かめた
      # 版の組み合わせを持っていて、それを知っているのは Expo のコマンドだけなので、
      # `npx expo install --fix`（SDK の中）と SDK を上げる作業で揃える。中身は Expo の
      # 組み合わせ（expo の bundledNativeModules.json）に載っている依存と expo 本体で、
      # `npm run check:dependabot-expo` が実際の依存との一致を確かめる。
      # expo-sdk-managed:start
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: eslint-config-expo
      - dependency-name: expo
      - dependency-name: expo-apple-authentication
      - dependency-name: expo-application
      - dependency-name: expo-build-properties
      - dependency-name: expo-clipboard
      - dependency-name: expo-constants
      - dependency-name: expo-crypto
      - dependency-name: expo-dev-client
      - dependency-name: expo-file-system
      - dependency-name: expo-font
      - dependency-name: expo-glass-effect
      - dependency-name: expo-haptics
      - dependency-name: expo-image-manipulator
      - dependency-name: expo-image-picker
      - dependency-name: expo-linking
      - dependency-name: expo-localization
      - dependency-name: expo-location
      - dependency-name: expo-router
      - dependency-name: expo-splash-screen
      - dependency-name: expo-status-bar
      - dependency-name: expo-system-ui
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-maps
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-worklets
      # expo-sdk-managed:end
      # 型定義は動かしている Node（24）に合わせる。
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
