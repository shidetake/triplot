# 依存の更新の PR を Dependabot に出させる。運用（どれを自動で入れ、どれを人が見るか）は
# docs/development.md の「依存の更新」。グループ名はラベルの付け分けと自動マージ
# （.github/workflows/dependabot.yml）がそのまま使うので、変えるなら両方を直す。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # 公開直後の版は取らない（乗っ取られたアカウントから出た悪意のある版は、たいてい
    # 数日で見つかって取り下げられる）。セキュリティの修正には効かない。
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      # 上から順に当てはまるものに入る。どれにも入らない（＝メジャー）は1件ずつの PR になる。
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      # iOS でだけ使う依存。マージしても次のビルドと TestFlight での確認を経てから
      # 利用者に届くので、自動で入れる。
      ios:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - react-native
          - react-native-*
          - "@react-native-async-storage/*"
          - "@react-native-community/*"
          - "@react-native-google-signin/*"
          - "@tanstack/react-query"
          - use-intl
        update-types: [minor, patch]
      web-production:
        dependency-type: production
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Expo の SDK が版を決めている依存は、SDK を上げる時に `npx expo install --fix` で
      # まとめて揃える。単独で上げると組み合わせが崩れる。`expo` 本体のメジャーだけは
      # 「新しい SDK が出た」知らせとして PR を出させる。
      - dependency-name: expo-*
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-native-*
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-native-community/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-expo
        update-types: ["version-update:semver-major"]
      # React Native は 0.x なので、マイナーが SDK を跨ぐ変更にあたる。React も SDK が
      # 版を1つに固定している（web も同じ版に揃えている）。
      - dependency-name: react-native
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
